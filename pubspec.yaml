name: nhac_lojas
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.11.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http_parser: ^4.0.2
  fl_chart: ^0.68.0
  flutter_screenutil: ^5.9.3
  go_router: ^14.0.0
  lottie: ^2.7.0
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3
  cached_network_image: ^4.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
